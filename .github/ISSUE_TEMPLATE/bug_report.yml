name: "Bug report"
description: "Something in the app doesn't work as expected (not a Quran text mistake)."
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      description: "What did you do, what did you expect, and what happened instead?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. Open Home
        2. Tap ...
        3. See ...
  - type: dropdown
    id: platform
    attributes:
      label: "Platform"
      multiple: true
      options:
        - "Android"
        - "iOS"
        - "Web"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: "Phone and system version"
      placeholder: "e.g. Redmi 9A, Android 10"
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots or screen recording"
      description: "Drag images or videos here."
